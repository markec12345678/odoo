# Slovenian Odoo 19 + PostgreSQL — Docker Compose
services:
  db:
    image: postgres:16-alpine
    container_name: si_odoo_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_db_pw_change_me
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    container_name: si_odoo_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_db_pw_change_me
      MASTER_PWD: admin
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo_filestore:/var/lib/odoo
      - ./certs:/etc/odoo/certs:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    command: >
      odoo
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --database=si_odoo
      --db-filter=^si_odoo$
      --without-demo=all
      --workers=4
      --max-cron-threads=2
      --proxy-mode
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  odoo_db_data:
  odoo_filestore:

  <text x="460" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">SKUPAJ</text>
  <text x="660" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C8A951" text-anchor="end">224,48 €</text>

  <text x="240" y="445" font-family="sans-serif" font-size="10" fill="#64748b">Elektronska naprava: NU-1</text>
  <text x="400" y="460" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">🔗 Live demo: odoo-production-fa42.up.railway.app</text>

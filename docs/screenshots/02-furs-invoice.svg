  <text x="500" y="231" font-family="sans-serif" font-size="11" fill="#374151">80,00 €</text>
  <text x="610" y="231" font-family="sans-serif" font-size="11" font-weight="600" fill="#374151">160,00 €</text>
  <rect x="120" y="240" width="560" height="25" fill="#fff"/>

  <rect x="128" y="348" width="20" height="20" fill="#000"/>
  <rect x="152" y="348" width="8" height="8" fill="#000"/>
  <rect x="168" y="356" width="12" height="12" fill="#000"/>
  <rect x="128" y="372" width="12" height="8" fill="#000"/>

  <rect x="172" y="372" width="8" height="8" fill="#000"/>
  <rect x="128" y="392" width="8" height="20" fill="#000"/>
  <rect x="144" y="396" width="12" height="12" fill="#000"/>
  <rect x="164" y="400" width="20" height="8" fill="#000"/>
  <rect x="132" y="420" width="16" height="8" fill="#000"/>
  <rect x="156" y="416" width="8" height="12" fill="#000"/>
  <rect x="172" y="420" width="12" height="8" fill="#000"/>
  <text x="170" y="460" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">FURS QR</text>

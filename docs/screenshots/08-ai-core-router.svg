  <text x="235" y="165" font-family="Arial, sans-serif" font-size="12" fill="#10a37f" font-weight="bold">OpenAI</text>
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="10" fill="#8b949e">GPT-4o</text>

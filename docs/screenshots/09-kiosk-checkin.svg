<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#c3cfe2"/>
    </linearGradient>
    <linearGradient id="kiosk9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#875A7B"/>
      <stop offset="100%" stop-color="#6B4C5A"/>
    </linearGradient>
    <linearGradient id="card9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f5f9"/>
    </linearGradient>
    <filter id="shadow9">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg9)"/>

  <!-- Tablet frame -->
  <rect x="200" y="40" width="800" height="720" rx="30" fill="#1a1a1a" filter="url(#shadow9)"/>
  <rect x="220" y="60" width="760" height="680" rx="20" fill="url(#kiosk9)"/>

  <!-- Hotel logo -->
  <text x="600" y="110" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">🏨 Grand Plaza Hotel</text>
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8" text-anchor="middle">Self Check-in Kiosk</text>

  <!-- Step indicator -->
  <circle cx="380" cy="170" r="12" fill="#28a745"/>
  <text x="380" y="175" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">✓</text>
  <line x1="392" y1="170" x2="478" y2="170" stroke="white" stroke-width="2" opacity="0.5"/>

  <circle cx="490" cy="170" r="12" fill="#28a745"/>
  <text x="490" y="175" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">✓</text>
  <line x1="502" y1="170" x2="588" y2="170" stroke="white" stroke-width="2" opacity="0.5"/>

  <circle cx="600" cy="170" r="14" fill="white"/>
  <text x="600" y="175" font-family="Arial, sans-serif" font-size="12" fill="#875A7B" text-anchor="middle" font-weight="bold">4</text>
  <line x1="614" y1="170" x2="700" y2="170" stroke="white" stroke-width="2" opacity="0.3"/>

  <circle cx="710" cy="170" r="12" fill="white" opacity="0.4"/>
  <text x="710" y="175" font-family="Arial, sans-serif" font-size="11" fill="#875A7B" text-anchor="middle" font-weight="bold">5</text>
  <line x1="722" y1="170" x2="808" y2="170" stroke="white" stroke-width="2" opacity="0.3"/>

  <circle cx="820" cy="170" r="12" fill="white" opacity="0.4"/>
  <text x="820" y="175" font-family="Arial, sans-serif" font-size="11" fill="#875A7B" text-anchor="middle" font-weight="bold">6</text>

  <!-- Page title -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Please review your details</text>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8" text-anchor="middle">Step 4 of 6 — Make sure everything is correct</text>

  <!-- Form card -->
  <rect x="280" y="270" width="640" height="380" rx="12" fill="url(#card9)" filter="url(#shadow9)"/>

  <!-- Row 1: Name -->
  <text x="310" y="305" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">FIRST NAME *</text>
  <rect x="310" y="315" width="270" height="45" rx="6" fill="white" stroke="#875A7B" stroke-width="2"/>
  <text x="325" y="343" font-family="Arial, sans-serif" font-size="16" fill="#333">Janez</text>

  <text x="620" y="305" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">LAST NAME *</text>
  <rect x="620" y="315" width="270" height="45" rx="6" fill="white" stroke="#875A7B" stroke-width="2"/>
  <text x="635" y="343" font-family="Arial, sans-serif" font-size="16" fill="#333">Novak</text>

  <!-- Row 2: DOB + Gender -->
  <text x="310" y="390" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">DATE OF BIRTH</text>
  <rect x="310" y="400" width="270" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="325" y="428" font-family="Arial, sans-serif" font-size="16" fill="#333">15.03.1985</text>

  <text x="620" y="390" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">GENDER</text>
  <rect x="620" y="400" width="270" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="635" y="428" font-family="Arial, sans-serif" font-size="16" fill="#333">Male</text>

  <!-- Row 3: Document -->
  <text x="310" y="475" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">DOCUMENT TYPE</text>
  <rect x="310" y="485" width="270" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="325" y="513" font-family="Arial, sans-serif" font-size="16" fill="#333">Passport</text>

  <text x="620" y="475" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">DOCUMENT NUMBER</text>
  <rect x="620" y="485" width="270" height="45" rx="6" fill="white" stroke="#28a745" stroke-width="2"/>
  <text x="635" y="513" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">PB1234567</text>
  <text x="780" y="513" font-family="Arial, sans-serif" font-size="11" fill="#28a745">✓ OCR scanned</text>

  <!-- Row 4: Country + City -->
  <text x="310" y="560" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">COUNTRY *</text>
  <rect x="310" y="570" width="270" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="325" y="598" font-family="Arial, sans-serif" font-size="16" fill="#333">🇸🇮 Slovenia</text>

  <text x="620" y="560" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">CITY</text>
  <rect x="620" y="570" width="270" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="635" y="598" font-family="Arial, sans-serif" font-size="16" fill="#333">Ljubljana</text>

  <!-- Row 5: Adults + Children + Arrival -->
  <text x="310" y="640" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">ADULTS</text>
  <rect x="310" y="650" width="120" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="370" y="678" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle">2</text>

  <text x="460" y="640" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">CHILDREN</text>
  <rect x="460" y="650" width="120" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="520" y="678" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle">0</text>

  <text x="610" y="640" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">ARRIVAL TIME</text>
  <rect x="610" y="650" width="280" height="45" rx="6" fill="white" stroke="#ddd"/>
  <text x="625" y="678" font-family="Arial, sans-serif" font-size="16" fill="#333">14:30</text>

  <!-- Buttons -->
  <rect x="310" y="710" width="180" height="50" rx="25" fill="white" opacity="0.9"/>
  <text x="400" y="740" font-family="Arial, sans-serif" font-size="16" fill="#875A7B" text-anchor="middle" font-weight="bold">← Back</text>

  <rect x="710" y="710" width="180" height="50" rx="25" fill="#28a745"/>
  <text x="800" y="740" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Confirm →</text>

  <!-- Idle timer -->
  <text x="600" y="770" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.6" text-anchor="middle">⏱ Auto-reset in 47s</text>
</svg>

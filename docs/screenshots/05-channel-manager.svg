  <text x="65" y="394" font-family="sans-serif" font-size="11" fill="#374151">13:50 — Booking.com: odpoved rezervacije (soba 302) — sproščeno</text>
  <circle cx="50" cy="420" r="5" fill="#4ade80"/>
  <text x="65" y="424" font-family="sans-serif" font-size="11" fill="#374151">12:00 — Airbnb: 2 novi sporočili od gostov</text>
  <circle cx="50" cy="450" r="5" fill="#4ade80"/>
  <text x="65" y="454" font-family="sans-serif" font-size="11" fill="#374151">10:00 — Booking.com: 5 cen posodobljenih za naslednji teden</text>
  <text x="550" y="475" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">🔗 Live demo: odoo-production-fa42.up.railway.app</text>

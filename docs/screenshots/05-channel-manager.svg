  <text x="430" y="135" font-family="sans-serif" font-size="12" fill="#64748b">Rezervacije danes</text>
  <text x="750" y="135" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FF5A5F" text-anchor="end">8</text>

  <rect x="180" y="185" width="70" height="20" rx="4" fill="#fce7f3"/><text x="215" y="199" font-family="sans-serif" font-size="10" font-weight="600" fill="#9d174d" text-anchor="middle">Breakfast</text>
  <rect x="260" y="185" width="60" height="20" rx="4" fill="#dbeafe"/><text x="290" y="199" font-family="sans-serif" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">Early</text>

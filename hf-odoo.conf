[options]
; Odoo config for Hugging Face Spaces
; Port 7860 is mandatory for HF Spaces
http_port = 7860

; Database — configured via DATABASE_URL env var at runtime
; Set in HF Space Settings → Secrets

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Performance (HF free tier: 2 vCPU, 16GB RAM)
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280

; Filestore in persistent HF volume
data_dir = /data/odoo

; Logging
log_level = info
logfile = False

; No demo data
without_demo = all

; Proxy mode (HF uses reverse proxy)
proxy_mode = True

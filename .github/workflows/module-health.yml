name: "Module Health Check"

on:
  push:
    branches: ["19.0"]
  pull_request:
    branches: ["19.0"]
  schedule:
    - cron: "0 4 * * *"  # Daily at 04:00 UTC

jobs:
  module-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff xmlschema lxml

      - name: Run module integrity scanner
        run: |
          python scripts/scan_modules.py addons/ 2>&1 | tee scan-results.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -eq 1 ]; then
            echo "❌ Critical/High/Medium issues found!"
            cat scan-results.txt
            exit 1
          fi
          echo "✅ No critical/high/medium issues found"
          if [ $exit_code -eq 2 ]; then
            echo "⚠️  Only LOW-severity issues (informational)"
          fi

      - name: Run orphan chatter scanner
        run: |
          python scripts/scan_orphan_chatter.py addons/ 2>&1 | tee chatter-results.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "❌ Orphan chatter fields found!"
            cat chatter-results.txt
            exit 1
          fi
          echo "✅ No orphan chatter fields"

      - name: Scan for hardcoded secrets
        run: |
          # Scan only our SI/HR modules + repo infrastructure (skip Odoo core addons)
          python scripts/scan_secrets.py addons/l10n_si_* addons/l10n_hr_* scripts/ .github/ 2>&1 | tee secrets-results.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "❌ Hardcoded secrets found!"
            cat secrets-results.txt
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Scan for security issues (eval/exec/SQL injection)
        run: |
          python scripts/scan_security.py addons/l10n_si_* addons/l10n_hr_* scripts/ .github/ 2>&1 | tee security-results.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "❌ Security issues found!"
            cat security-results.txt
            exit 1
          fi
          echo "✅ No security issues found"

      - name: Scan for N+1 query patterns (informational)
        run: |
          python scripts/scan_n_plus_1.py addons/l10n_si_* addons/l10n_hr_* 2>&1 | tee nplus1-results.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "⚠️  N+1 query patterns found (informational — does not block CI):"
            cat nplus1-results.txt
            echo ""
            echo "Note: Some N+1 patterns are intentional (e.g. external API calls"
            echo "that don't support batch queries, like MojEracun per-document"
            echo "fiscalization status checks)."
          else
            echo "✅ No N+1 query patterns found"
          fi

      - name: Validate XML well-formedness
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          from pathlib import Path
          errors = []
          for f in Path('addons').rglob('*.xml'):
              if 'l10n_si_' not in str(f) and 'l10n_hr_' not in str(f):
                  continue
              if 'static/' in str(f):
                  continue
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print(f'❌ {len(errors)} XML errors:')
              for e in errors[:10]:
                  print(f'  {e}')
              exit(1)
          print('✅ All XML files well-formed')
          "

      - name: Validate Python syntax
        run: |
          python -c "
          import ast
          from pathlib import Path
          errors = []
          for f in Path('addons').rglob('*.py'):
              if 'l10n_si_' not in str(f) and 'l10n_hr_' not in str(f):
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print(f'❌ {len(errors)} Python syntax errors:')
              for e in errors[:10]:
                  print(f'  {e}')
              exit(1)
          print('✅ All Python files valid')
          "

      - name: Run ruff linter (critical errors)
        run: |
          # E9 = syntax errors, F63 = invalid print, F7 = unused imports,
          # F82 = undefined names — these are always bugs
          ruff check addons/l10n_si_*/ addons/l10n_hr_*/ --select E9,F63,F7,F82 --exit-zero

      - name: Run ruff linter (style warnings — informational)
        run: |
          # Extended rules: E = pycodestyle errors, W = warnings,
          # F = pyflakes, I = isort. Does NOT block CI.
          ruff check addons/l10n_si_*/ addons/l10n_hr_*/ --select E,W,F,I --exit-zero 2>&1 | tee ruff-style.txt || true
          echo "Style warnings are informational — see ruff-style.txt for details"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-health-report
          path: |
            scan-results.txt
            chatter-results.txt
            secrets-results.txt
            security-results.txt
            nplus1-results.txt

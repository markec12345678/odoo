name: Deploy to Staging

on:
  push:
    branches: [19.0]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to staging server
    runs-on: ubuntu-24.04
    if: github.repository == 'markec12345678/odoo'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff==0.15.0 requests qrcode pillow

      - name: Run all tests
        run: |
          echo "=== Unit tests ==="
          python3 .github/scripts/run_unit_tests.py
          echo "=== E2E tests ==="
          python3 .github/scripts/run_e2e_tests.py

      - name: Build Docker image
        run: |
          echo "Building Docker image for staging..."
          # In production: docker build -t si-odoo:staging .
          # docker push registry.example.com/si-odoo:staging
          echo "Docker build simulated (configure your registry)"

      - name: Deploy notification
        if: success()
        run: |
          echo "✅ Deployment successful to staging"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Modules: $(ls -d addons/l10n_si_* | grep -v README | wc -l) SI + $(ls -d addons/l10n_hr_* | wc -l) HR"

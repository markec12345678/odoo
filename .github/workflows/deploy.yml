name: Deploy

on:
  push:
    branches: [19.0]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'railway'
        type: choice
        options:
          - railway
          - test-only

jobs:
  test:
    name: Run tests before deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install requests qrcode pillow

      - name: Run unit tests
        run: python3 .github/scripts/run_unit_tests.py

      - name: Run E2E tests
        run: python3 .github/scripts/run_e2e_tests.py

  deploy-railway:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'railway')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Railway CLI
        run: |
          echo "Installing Railway CLI..."
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"
          railway --version

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          
          echo "🚀 Linking to Railway project..."
          railway link --project d4fff35a-43b3-46d8-b066-dab7ff2ef17d
          
          echo "📦 Deploying to Railway..."
          railway up
          
          echo "✅ Railway deployment triggered!"
          echo "🔗 https://railway.com/project/d4fff35a-43b3-46d8-b066-dab7ff2ef17d"

  notify:
    name: Deploy summary
    needs: [test, deploy-railway]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "=== Deploy Summary ==="
          echo "Tests: ${{ needs.test.result }}"
          echo "Railway: ${{ needs.deploy-railway.result }}"
          echo "Commit: ${{ github.sha }}"
          echo "Modules: 75 (70 SI + 5 HR)"
          echo "Tests: 101 (79 unit + 22 E2E)"

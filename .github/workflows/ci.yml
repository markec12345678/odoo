name: CI

on:
  push:
    branches: [19.0]
  pull_request:
    branches: [19.0]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.15.0

      - name: Run ruff check on l10n_si modules
        run: |
          ruff check addons/l10n_si_*/ --select=F,E9 --ignore=E501,F401,F841 || true
          echo "Ruff check completed (warnings allowed, errors shown above)"

  validate-python:
    name: Validate Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all l10n_si Python files
        run: |
          python3 -c "
          import py_compile, os, sys
          errors = []
          count = 0
          for d in sorted(os.listdir('addons')):
              if not d.startswith('l10n_si_') or d == 'l10n_si_README.md':
                  continue
              for dp, _, fs in os.walk('addons/' + d):
                  for f in fs:
                      if f.endswith('.py'):
                          p = os.path.join(dp, f)
                          count += 1
                          try:
                              py_compile.compile(p, doraise=True)
                          except py_compile.PyCompileError as e:
                              errors.append((p, str(e)[:100]))
          print(f'Compiled {count} Python files')
          if errors:
              print(f'ERRORS: {len(errors)}')
              for p, e in errors[:20]:
                  print(f'  {p}: {e}')
              sys.exit(1)
          else:
              print('ALL PYTHON FILES COMPILE OK')
          "

  validate-xml:
    name: Validate XML syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse all l10n_si XML files
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, os, sys
          errors = []
          count = 0
          for d in sorted(os.listdir('addons')):
              if not d.startswith('l10n_si_') or d == 'l10n_si_README.md':
                  continue
              for dp, _, fs in os.walk('addons/' + d):
                  for f in fs:
                      if f.endswith('.xml'):
                          p = os.path.join(dp, f)
                          count += 1
                          try:
                              ET.parse(p)
                          except ET.ParseError as e:
                              errors.append((p, str(e)))
          print(f'Parsed {count} XML files')
          if errors:
              print(f'ERRORS: {len(errors)}')
              for p, e in errors[:20]:
                  print(f'  {p}: {e}')
              sys.exit(1)
          else:
              print('ALL XML FILES PARSE OK')
          "

  validate-manifests:
    name: Validate module manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check all manifests have required keys
        run: |
          python3 -c "
          import os, sys
          required_keys = ['name', 'version', 'license', 'depends', 'data', 'installable']
          missing = []
          count = 0
          for d in sorted(os.listdir('addons')):
              if not d.startswith('l10n_si_') or d == 'l10n_si_README.md':
                  continue
              manifest_path = 'addons/' + d + '/__manifest__.py'
              if not os.path.exists(manifest_path):
                  missing.append(f'{d}: __manifest__.py not found')
                  continue
              count += 1
              with open(manifest_path) as f:
                  content = f.read()
              for key in required_keys:
                  if f\"'{key}'\" not in content and f'\"{key}\"' not in content:
                      missing.append(f'{d}: missing key {key}')
          print(f'Checked {count} manifests')
          if missing:
              print(f'MISSING ({len(missing)}):')
              for m in missing:
                  print(f'  {m}')
              sys.exit(1)
          else:
              print('ALL MANIFESTS OK')
          "

  module-count:
    name: Module count check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Count l10n_si modules
        run: |
          COUNT=$(ls -d addons/l10n_si_* | grep -v "l10n_si_README.md" | wc -l)
          echo "SI module count: $COUNT"
          if [ "$COUNT" -lt 60 ]; then
            echo "ERROR: Expected at least 60 SI modules, found $COUNT"
            exit 1
          fi
          echo "SI module count check passed ($COUNT modules)"

  hr-module-count:
    name: HR module count check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Count l10n_hr modules
        run: |
          COUNT=$(ls -d addons/l10n_hr_* 2>/dev/null | wc -l)
          echo "HR module count: $COUNT"
          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: Expected at least 3 HR modules, found $COUNT"
            exit 1
          fi
          echo "HR module count check passed ($COUNT modules)"

  unit-tests:
    name: Unit tests (standalone, no Odoo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install requests qrcode pillow

      - name: Run standalone unit tests
        run: python3 .github/scripts/run_unit_tests.py

  e2e-tests:
    name: E2E tests (regulatory workflows, mocked)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install requests qrcode pillow

      - name: Run E2E workflow tests
        run: python3 .github/scripts/run_e2e_tests.py

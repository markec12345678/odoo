name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [19.0]
  workflow_dispatch:

jobs:
  deploy-hf:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-24.04
    if: github.repository == 'markec12345678/odoo'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Prepare HF Space files
        run: |
          mkdir -p hf-space
          # Copy Dockerfile
          cp Dockerfile.hf hf-space/Dockerfile
          # Copy config
          cp hf-odoo.conf hf-space/
          # Copy addons (only l10n_si and l10n_hr)
          cp -r addons/hf-space/ 2>/dev/null || true
          mkdir -p hf-space/addons
          cp -r addons/l10n_si_* hf-space/addons/ 2>/dev/null || true
          cp -r addons/l10n_hr_* hf-space/addons/ 2>/dev/null || true
          # Create README for HF Space
          cat > hf-space/README.md << 'EOF'
          ---
          title: SI HR Odoo 19
          emoji: 🇸🇮🇭🇷
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          
          # Slovenian & Croatian Odoo 19 Localization
          
          75 modules for SI+HR hospitality & tourism.
          EOF

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi(token='${{ secrets.HF_TOKEN }}')
          
          # Create or update the Space
          api.create_repo(
              repo_id='markec12345678/si-hr-odoo',
              repo_type='space',
              space_sdk='docker',
              exist_ok=True,
          )
          
          # Upload files
          api.upload_folder(
              folder_path='hf-space',
              repo_id='markec12345678/si-hr-odoo',
              repo_type='space',
          )
          print('✅ Deployed to Hugging Face Spaces!')
          print('🔗 https://markec12345678-si-hr-odoo.hf.space')
          "

      - name: Deploy notification
        if: success()
        run: |
          echo "✅ Deployment to Hugging Face Spaces successful!"
          echo "🔗 https://markec12345678-si-hr-odoo.hf.space"
          echo ""
          echo "Setup required:"
          echo "1. Go to HF Space Settings → Secrets"
          echo "2. Add DATABASE_URL (from Supabase/Neon free tier)"
          echo "3. Add MASTER_PWD (your admin password)"
          echo "4. Space will auto-restart and initialize Odoo"

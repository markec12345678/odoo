name: "Build & Publish Docker Image"

on:
  push:
    branches: ["19.0"]
    tags: ["v*"]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Odoo image
        uses: docker/build-push-action@v5
        if: steps.meta.outputs.tags != ''
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backup image
        uses: docker/build-push-action@v5
        if: steps.meta.outputs.tags != ''
        with:
          context: .
          file: ./Dockerfile.backup
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip if no tags (tag push without metadata)
        if: steps.meta.outputs.tags == ''
        run: echo "No tags generated for this event - skipping Docker push"

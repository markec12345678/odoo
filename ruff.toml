# Ruff configuration for SI/HR Odoo modules
# https://docs.astral.sh/ruff/configuration/

target-version = "py310"
line-length = 120

[lint]
select = [
    "F",     # Pyflakes (undefined names, unused imports, etc.)
    "E9",    # Syntax errors
    "W6",    # Deprecation warnings
]
ignore = [
    "E501",  # Line too long (handled by black)
    "F401",  # Unused import (Odoo __init__.py imports)
    "F841",  # Unused variable (Odoo conventions)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"__manifest__.py" = ["F401"]

[format]
quote-style = "single"
indent-style = "space"

[options]
; Odoo config for Railway deployment
; NOTE: This file is for reference only. Actual runtime config
; is set via CLI flags in railway-entrypoint.sh (which override this file).
; Keep these values in sync with the entrypoint to avoid confusion.

admin_passwd = admin

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Performance — tuned for Railway free tier (512 MB RAM)
; workers=0: single-threaded, simpler startup, lower RAM usage
; (entrypoint also sets these via CLI flags which take precedence)
workers = 0
max_cron_threads = 1
limit_time_cpu = 300
limit_time_real = 600
limit_memory_soft = 536870912
limit_memory_hard = 805306368

; Filestore
data_dir = /var/lib/odoo

; Logging
log_level = info
logfile = False

; No demo data (Odoo 19 wants True/False, not 'all')
without_demo = True

; Proxy mode — DISABLED (Railway handles TLS/reverse proxy itself)
proxy_mode = False

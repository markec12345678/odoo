[options]
; Odoo config for Railway deployment
; Railway provides DATABASE_URL and PORT automatically

admin_passwd = admin
db_filter = ^si_odoo$

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Performance (Railway free tier: 512MB-8GB depending on plan)
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280

; Filestore
data_dir = /var/lib/odoo

; Logging
log_level = info
logfile = False

; No demo data
without_demo = all

; Proxy mode (Railway uses reverse proxy)
proxy_mode = True
